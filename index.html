<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>115 貓咪盃讀題塗色互動練習｜23 題完整實戰題庫</title>
  <style>
    :root {
      --navy: #1b2a4a;
      --navy-2: #2a3f6b;
      --bg: #eef2f7;
      --surface: #ffffff;
      --border: #d5dfec;
      --text: #1e293b;
      --muted: #5b6b82;

      --red: #dc2626;
      --red-hl: rgba(239, 68, 68, 0.25);
      --red-bg: #fef2f2;

      --amber: #d97706;
      --amber-hl: rgba(245, 158, 11, 0.32);
      --amber-bg: #fffbeb;

      --green: #059669;
      --green-hl: rgba(16, 185, 129, 0.27);
      --green-bg: #ecfdf5;

      --blue: #2563eb;
      --blue-hl: rgba(59, 130, 246, 0.25);
      --blue-bg: #eff6ff;

      --purple: #7c3aed;
      --purple-bg: #f5f3ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.72;
    }

    /* Sticky Topbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--navy);
      color: #fff;
      box-shadow: 0 3px 14px rgba(15, 23, 42, 0.2);
    }

    .topbar-row1 {
      max-width: 1480px;
      margin: 0 auto;
      padding: 9px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 16px;
    }

    .brand-badge {
      background: var(--blue);
      color: #fff;
      font-size: 11.5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 700;
    }

    .cat-tabs, .mode-switch {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cat-btn {
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .cat-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .cat-btn[aria-pressed="true"] {
      background: #fff;
      color: var(--navy);
      border-color: #fff;
    }

    .mode-btn {
      border: 1px solid rgba(255,255,255,0.25);
      background: transparent;
      color: #cbd5e1;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
    }
    .mode-btn[aria-pressed="true"] {
      background: #f59e0b;
      color: #1e293b;
      border-color: #f59e0b;
    }

    /* Exam Picker Strip */
    .topbar-picker {
      max-width: 1480px;
      margin: 0 auto;
      padding: 7px 20px;
      background: var(--navy-2);
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .exam-chip {
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s ease;
    }
    .exam-chip:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .exam-chip[aria-pressed="true"] {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      font-weight: 800;
    }
    .exam-chip .chip-score {
      margin-left: 4px;
      font-size: 11px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.9);
      color: #fff;
    }

    /* Highlighter Toolbar */
    .topbar-row2 {
      max-width: 1480px;
      margin: 0 auto;
      padding: 9px 20px;
      background: #ffffff;
      color: var(--text);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .pen-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .pen-label { font-size: 13px; font-weight: 700; color: var(--muted); }

    .pen-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 9px;
      border: 2px solid var(--border);
      background: #fff;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .pen-btn:hover { transform: translateY(-1px); }
    .pen-btn kbd {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      padding: 1px 4px;
      border-radius: 4px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #475569;
    }

    .pen-btn[data-pen="core"][aria-pressed="true"]  { background: var(--red-bg);   border-color: var(--red);   color: var(--red);   box-shadow: 0 0 0 3px rgba(220,38,38,0.16); }
    .pen-btn[data-pen="bonus"][aria-pressed="true"] { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); box-shadow: 0 0 0 3px rgba(217,119,6,0.18); }
    .pen-btn[data-pen="goal"][aria-pressed="true"]  { background: var(--green-bg); border-color: var(--green); color: var(--green); box-shadow: 0 0 0 3px rgba(5,150,105,0.16); }
    .pen-btn[data-pen="theme"][aria-pressed="true"] { background: var(--blue-bg);  border-color: var(--blue);  color: var(--blue);  box-shadow: 0 0 0 3px rgba(37,99,235,0.16); }
    .pen-btn[data-pen="eraser"][aria-pressed="true"]{ background: #f1f5f9;         border-color: #475569;      color: #0f172a;      box-shadow: 0 0 0 3px rgba(71,85,105,0.14); }

    .action-group { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }

    .btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #f8fafc; border-color: #94a3b8; }
    .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: var(--green); color: #fff; border-color: var(--green); }
    .btn-success:hover { background: #047857; }
    .btn-danger { color: var(--red); border-color: #fecaca; }
    .btn-danger:hover { background: var(--red-bg); }

    /* Main Workspace */
    .workspace {
      max-width: 1480px;
      margin: 18px auto 40px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: minmax(0, 1.85fr) minmax(330px, 1fr);
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 1024px) { .workspace { grid-template-columns: 1fr; } }

    /* Official PDF Paper Style (Dense Competition Look) */
    .paper {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      padding: 32px 36px 38px;
    }

    .paper-title {
      text-align: center;
      font-family: "BiauKaiTC", "DFKai-SB", "PingFang TC", serif;
      font-size: 23px;
      font-weight: 700;
      margin: 0 0 3px;
      color: #0f172a;
      letter-spacing: 1px;
    }

    .paper-subtitle {
      text-align: center;
      font-family: "BiauKaiTC", "DFKai-SB", "PingFang TC", serif;
      font-size: 19px;
      font-weight: 700;
      margin: 0 0 16px;
      color: #0f172a;
    }

    .hint-banner {
      background: #f8fafc;
      border: 1px dashed #94a3b8;
      border-radius: 8px;
      padding: 9px 13px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .official-table {
      width: 100%;
      border-collapse: collapse;
      border: 2px solid #1e293b;
      font-size: 15.5px;
      line-height: 1.82;
    }

    .official-table th, .official-table td {
      border: 1px solid #334155;
      padding: 12px 15px;
      vertical-align: top;
      text-align: justify;
    }

    .official-table th {
      width: 88px;
      text-align: center;
      vertical-align: middle;
      background: #f8fafc;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 2px;
    }

    .task-block { margin-bottom: 12px; }
    .task-block:last-child { margin-bottom: 0; }
    .task-heading { font-weight: 700; color: #0f172a; margin-bottom: 2px; }

    /* Seamless Interactive Segments (Looks like plain PDF text until hovered/marked) */
    .seg {
      display: inline;
      padding: 1px 2px;
      border-radius: 3px;
      cursor: pointer;
      transition: background-color 0.12s ease;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    .seg:hover {
      background-color: rgba(148, 163, 184, 0.22);
      outline: 1px dashed #64748b;
    }

    .seg[data-marked="core"]  { background-color: var(--red-hl);   box-shadow: inset 0 -2px 0 var(--red); }
    .seg[data-marked="bonus"] { background-color: var(--amber-hl); box-shadow: inset 0 -2px 0 var(--amber); }
    .seg[data-marked="goal"]  { background-color: var(--green-hl); box-shadow: inset 0 -2px 0 var(--green); }
    .seg[data-marked="theme"] { background-color: var(--blue-hl);  box-shadow: inset 0 -2px 0 var(--blue); }

    .seg.grade-correct::after {
      content: "✓";
      display: inline-block;
      margin-left: 3px;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      background: var(--green);
      border-radius: 999px;
      padding: 0 5px;
      vertical-align: middle;
    }
    .seg.grade-wrong-color { outline: 2px dotted var(--amber); }
    .seg.grade-wrong-color::after {
      content: "換色";
      display: inline-block;
      margin-left: 3px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: var(--amber);
      border-radius: 4px;
      padding: 0 4px;
      vertical-align: middle;
    }
    .seg.grade-missed {
      outline: 2px dashed var(--red);
      background-color: rgba(239, 68, 68, 0.08);
    }
    .seg.grade-missed::after {
      content: "漏抓";
      display: inline-block;
      margin-left: 3px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: var(--red);
      border-radius: 4px;
      padding: 0 4px;
      vertical-align: middle;
    }
    .seg.grade-extra { text-decoration: line-through; opacity: 0.7; }

    /* Right Sidebar */
    .sidebar {
      position: sticky;
      top: 158px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: calc(100vh - 172px);
      overflow-y: auto;
      padding-right: 4px;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px 17px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    }

    .panel-title {
      margin: 0 0 10px;
      font-size: 15.5px;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .score-box {
      display: none;
      background: linear-gradient(135deg, #1b2a4a, #2a3f6b);
      color: #fff;
      border-radius: 10px;
      padding: 13px 15px;
      margin-bottom: 12px;
    }
    .score-box.show { display: block; }
    .score-num { font-size: 30px; font-weight: 800; line-height: 1.1; }
    .score-stats {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 7px;
      font-size: 12px;
      color: #e2e8f0;
    }

    .trap-box {
      display: none;
      background: var(--purple-bg);
      border: 1px solid #ddd6fe;
      border-left: 4px solid var(--purple);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #3b0764;
    }
    .trap-box.show { display: block; }

    .checklist-group { margin-bottom: 10px; }
    .checklist-group:last-child { margin-bottom: 0; }
    .cg-header {
      font-size: 12.5px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
    .cg-header.core  { background: var(--red-bg);   color: var(--red); }
    .cg-header.bonus { background: var(--amber-bg); color: var(--amber); }
    .cg-header.goal  { background: var(--green-bg); color: var(--green); }
    .cg-header.theme { background: var(--blue-bg);  color: var(--blue); }

    .cg-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
    .cg-item {
      font-size: 12.5px;
      padding: 5px 8px;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      cursor: pointer;
    }
    .cg-item:hover { background: #f1f5f9; }
    .cg-empty { font-size: 12px; color: #94a3b8; padding: 2px 8px; }

    .explain-box {
      background: #f8fafc;
      border-left: 4px solid var(--navy);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text);
    }

    .timer-pill {
      font-family: ui-monospace, monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--navy);
      border: 1px solid #cbd5e1;
      cursor: pointer;
    }

    @media print {
      .topbar, .hint-banner, .action-group, .no-print, .entry-overlay { display: none !important; }
      .workspace { display: block; margin: 0; padding: 0; }
      .paper { box-shadow: none; border: none; padding: 0; }
      .sidebar { position: static; max-height: none; margin-top: 20px; }
    }

    /* Entry Selection Overlay */
    .entry-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: linear-gradient(135deg, #1b2a4a 0%, #243b6b 55%, #16223d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .entry-overlay.hidden { display: none; }

    .entry-card-wrap {
      max-width: 860px;
      width: 100%;
      text-align: center;
      color: #fff;
    }
    .entry-badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.25);
      border: 1px solid rgba(96, 165, 250, 0.55);
      color: #bfdbfe;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .entry-title {
      font-size: 34px;
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: 0.5px;
    }
    .entry-sub {
      font-size: 16px;
      color: #cbd5e1;
      margin: 0 0 30px;
    }
    .entry-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin-bottom: 24px;
    }
    @media (max-width: 680px) { .entry-grid { grid-template-columns: 1fr; } }

    .entry-choice {
      background: #ffffff;
      color: var(--text);
      border: 3px solid transparent;
      border-radius: 16px;
      padding: 28px 24px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .entry-choice:hover { transform: translateY(-4px); box-shadow: 0 20px 44px rgba(0, 0, 0, 0.35); }
    .entry-choice.elem:hover { border-color: #10b981; }
    .entry-choice.jh:hover   { border-color: #3b82f6; }

    .choice-tag {
      display: inline-block;
      font-size: 12.5px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .entry-choice.elem .choice-tag { background: var(--green-bg); color: var(--green); }
    .entry-choice.jh   .choice-tag { background: var(--blue-bg);  color: var(--blue); }

    .choice-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--navy);
      margin: 0 0 8px;
    }
    .choice-desc {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 14px;
      line-height: 1.6;
    }
    .choice-meta {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .entry-teacher-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #e2e8f0;
      padding: 9px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .entry-teacher-btn:hover { background: rgba(255, 255, 255, 0.22); color: #fff; }

    .home-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .home-btn:hover { background: rgba(255, 255, 255, 0.24); }
  </style>
</head>
<body>

<!-- Entry Selection Screen -->
<div class="entry-overlay" id="entryOverlay" role="dialog" aria-modal="true" aria-label="選擇組別">
  <div class="entry-card-wrap">
    <div class="entry-badge">115 學年度花蓮縣貓咪盃 SCRATCH AI 互動程式設計集訓</div>
    <h1 class="entry-title">讀題四色塗色互動練習</h1>
    <p class="entry-sub">請先選擇你的組別，進入對應的題目卷與實戰題庫！</p>

    <div class="entry-grid">
      <button class="entry-choice elem" id="chooseElem">
        <span class="choice-tag">🟩 國小組</span>
        <div class="choice-title">國小遊戲 AI 互動組</div>
        <p class="choice-desc">收錄今年官方初賽題《救回媽媽的 LINE！》，以及 10 題由淺入深、暗藏陷阱的校園生活實戰練習題（E01–E10）。</p>
        <div class="choice-meta">📌 1 題官方示範 ＋ 10 題實戰練習（共 11 題）→</div>
      </button>

      <button class="entry-choice jh" id="chooseJH">
        <span class="choice-tag">🟦 國中組</span>
        <div class="choice-title">國中生活 AI ＋ AI 智慧生活組</div>
        <p class="choice-desc">收錄今年兩組官方初賽題，以及 10 題結合 Facemesh / Handpose 與 ML2Scratch 的進階陷阱實戰題（J01–J10）。</p>
        <div class="choice-meta">📌 2 題官方示範 ＋ 10 題實戰練習（共 12 題）→</div>
      </button>
    </div>

    <button class="entry-teacher-btn" id="chooseTeacher">🎓 老師示範入口（檢視全部 23 題＋預設示範模式）</button>
  </div>
</div>

<header class="topbar">
  <div class="topbar-row1">
    <div class="brand">
      <button class="home-btn" id="btnHome" title="回到組別選擇畫面">🏠 切換組別</button>
      <span class="brand-badge" id="levelBadge">115 花蓮貓咪盃</span>
      <span>讀題四色塗色實戰</span>
    </div>

    <div class="cat-tabs" id="catTabs" role="group" aria-label="切換題庫分類"></div>

    <div class="mode-switch" role="group" aria-label="切換模式">
      <button class="mode-btn" data-mode="demo" aria-pressed="true">🎓 老師示範模式</button>
      <button class="mode-btn" data-mode="quiz" aria-pressed="false">🎮 學生闖關模式</button>
    </div>
  </div>

  <div class="topbar-picker" id="examPicker" role="group" aria-label="選擇題目"></div>

  <div class="topbar-row2">

// State + localStorage persistence
const STORAGE_KEY = "catcup_115_reading_v2";
let savedState = {};
try { savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) {}

let currentLevel = "all"; // "elem" | "jh" | "all"
let currentCat = "official";
let currentExamId = EXAMS[0].id;
let currentMode = "demo";
let currentPen = "core";
let marksByExam = savedState.marksByExam || {};
let bestScoreByExam = savedState.bestScoreByExam || {};
let gradedByExam = {};
let revealedByExam = {};

function getVisibleExamsForCat(cat) {
  return EXAMS.filter(e => {
    if (e.cat !== cat) return false;
    if (currentLevel === "elem" && cat === "official") return e.id === "off_elem";
    if (currentLevel === "jh" && cat === "official") return e.id === "off_jhl" || e.id === "off_jhs";
    return true;
  });
}

function renderCatTabs() {
  const tabsEl = document.getElementById("catTabs");
  let tabs = [];
  if (currentLevel === "elem") {
    tabs = [
      { cat: "official", label: "📌 國小官方示範（1 題）" },
      { cat: "elem",     label: "🟩 國小實戰練習（10 題）" },
    ];
  } else if (currentLevel === "jh") {
    tabs = [
      { cat: "official", label: "📌 國中官方示範（2 題）" },
      { cat: "jh",       label: "🟦 國中實戰練習（10 題）" },
    ];
  } else {
    tabs = [
      { cat: "official", label: "📌 官方示範（3 題）" },
      { cat: "elem",     label: "🟩 國小練習（10 題）" },
      { cat: "jh",       label: "🟦 國中練習（10 題）" },
    ];
  }

  tabsEl.innerHTML = tabs.map(t =>
    `<button class="cat-btn" data-cat="${t.cat}" aria-pressed="${t.cat === currentCat}">${t.label}</button>`
  ).join("");

  tabsEl.querySelectorAll(".cat-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentCat = btn.dataset.cat;
      const list = getVisibleExamsForCat(currentCat);
      if (list.length) currentExamId = list[0].id;
      document.getElementById("explainBox").innerHTML = "點選題目中任何一段文字，這裡會顯示詳細解析！";
      renderCatTabs();
      renderPicker();
      renderExam();
    });
  });
}

function enterLevel(level) {
  currentLevel = level;
  if (level === "elem") {
    currentCat = "elem";
    currentMode = "quiz";
    document.getElementById("levelBadge").textContent = "🟩 國小組";
  } else if (level === "jh") {
    currentCat = "jh";
    currentMode = "quiz";
    document.getElementById("levelBadge").textContent = "🟦 國中組";
  } else {
    currentCat = "official";
    currentMode = "demo";
    document.getElementById("levelBadge").textContent = "🎓 老師示範（全部）";
  }

  document.querySelectorAll(".mode-btn").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.mode === currentMode));
  });

  const list = getVisibleExamsForCat(currentCat);
  if (list.length) currentExamId = list[0].id;
  seconds = 0;
  timerRunning = true;

  document.getElementById("entryOverlay").classList.add("hidden");
  document.getElementById("explainBox").innerHTML = "點選題目中任何一段文字，這裡會顯示詳細解析！";
  renderCatTabs();
  renderPicker();
  renderExam();
}

document.getElementById("chooseElem").addEventListener("click", () => enterLevel("elem"));
document.getElementById("chooseJH").addEventListener("click", () => enterLevel("jh"));
document.getElementById("chooseTeacher").addEventListener("click", () => enterLevel("all"));
document.getElementById("btnHome").addEventListener("click", () => {
  document.getElementById("entryOverlay").classList.remove("hidden");
});

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ marksByExam, bestScoreByExam }));
  } catch (e) {}
}

function getExam(id) {
  return EXAMS.find(e => e.id === id) || EXAMS[0];
}

function getAllSegments(exam) {
  const list = [...exam.context];
  exam.tasks.forEach(t => list.push(...t.segs));
  return list;
}

// Timer
let seconds = 0;
let timerRunning = true;
setInterval(() => {
  if (!timerRunning) return;
  seconds++;
  const m = String(Math.floor(seconds / 60)).padStart(2, "0");
  const s = String(seconds % 60).padStart(2, "0");
  document.getElementById("timerDisplay").textContent = `⏱ ${m}:${s}`;
}, 1000);

document.getElementById("timerDisplay").addEventListener("click", () => {
  timerRunning = !timerRunning;
  document.getElementById("timerDisplay").style.opacity = timerRunning ? "1" : "0.55";
});

function renderPicker() {
  const list = getVisibleExamsForCat(currentCat);
  const picker = document.getElementById("examPicker");
  picker.innerHTML = list.map(ex => {
    const best = bestScoreByExam[ex.id];
    const badge = best !== undefined ? `<span class="chip-score">${best}分</span>` : "";
    return `<button class="exam-chip" data-id="${ex.id}" aria-pressed="${ex.id === currentExamId}">${ex.code} ${ex.short}${badge}</button>`;
  }).join("");

  picker.querySelectorAll(".exam-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      currentExamId = btn.dataset.id;
      if (currentMode === "quiz") { seconds = 0; timerRunning = true; }
      document.getElementById("explainBox").innerHTML = "點選題目中任何一段文字，這裡會顯示詳細解析！";
      renderPicker();
      renderExam();
    });
  });
}

function renderExam() {
  const ex = getExam(currentExamId);
  const marks = marksByExam[ex.id] || {};
  const isGraded = !!gradedByExam[ex.id];

  document.getElementById("paperSub").textContent =
    ex.cat === "official" ? "初賽題目（官方示範）" :
    ex.cat === "elem" ? "大量讀題實戰練習（國小組）" : "大量讀題實戰練習（國中組）";

  const makeSegHtml = (seg) => {
    const m = marks[seg.id] || "";
    let cls = "seg";
    if (isGraded) {
      if (seg.ans && m === seg.ans) cls += " grade-correct";
      else if (seg.ans && m && m !== seg.ans) cls += " grade-wrong-color";
      else if (seg.ans && !m) cls += " grade-missed";
      else if (!seg.ans && m) cls += " grade-extra";
    }
    return `<span class="${cls}" data-id="${seg.id}" ${m ? `data-marked="${m}"` : ""}>${seg.text}</span>`;
  };

  const contextHtml = ex.context.map(makeSegHtml).join("");
  const tasksHtml = ex.tasks.map(t => `
    <div class="task-block">
      <div class="task-heading">${t.heading}</div>
      <div>${t.segs.map(makeSegHtml).join("")}</div>
    </div>
  `).join("");

  document.getElementById("examTable").innerHTML = `
    <tr><th>組別</th><td>${ex.groupHtml}</td></tr>
    <tr><th>題目</th><td><strong>${ex.title}</strong></td></tr>
    <tr><th>情境<br>說明</th><td>${contextHtml}</td></tr>
    <tr><th>任務<br>說明</th><td>${tasksHtml}</td></tr>
    <tr><th>程式<br>說明<br>文件</th><td>${ex.docReq}</td></tr>
  `;

  document.querySelectorAll(".seg").forEach(el => {
    el.addEventListener("click", () => handleSegClick(el.dataset.id));
  });

  renderChecklist();
  updateHeaderUI();
}

function handleSegClick(segId) {
  const ex = getExam(currentExamId);
  if (!marksByExam[ex.id]) marksByExam[ex.id] = {};
  const marks = marksByExam[ex.id];
  const seg = getAllSegments(ex).find(s => s.id === segId);

  if (currentPen === "eraser") {
    delete marks[segId];
  } else {
    if (marks[segId] === currentPen) delete marks[segId];
    else marks[segId] = currentPen;
  }
  saveProgress();

  if (currentMode === "demo" || gradedByExam[ex.id] || revealedByExam[ex.id]) {
    showExplain(seg);
  } else {
    document.getElementById("explainBox").innerHTML =
      `已標記為 <strong>${currentPen === "eraser" ? "清除" : PEN_META[currentPen].emoji + " " + PEN_META[currentPen].name}</strong>！<br>全部標記完成後，按下上方「✅ 交卷批改」即可看分數、抓出暗藏陷阱與解析。`;
  }

  renderExam();
}

function showExplain(seg) {
  const box = document.getElementById("explainBox");
  if (!seg) return;
  const ansLabel = seg.ans
    ? `${PEN_META[seg.ans].emoji} 建議歸類：<strong>${PEN_META[seg.ans].name}</strong>`
    : `⚪ 一般敘述／舉例（不需特別畫線）`;
  box.innerHTML = `
    <div style="margin-bottom:6px;">${ansLabel}</div>
    <div style="color:#475569; font-size:12.5px; margin-bottom:6px;">「${seg.text}」</div>
    <div><strong>解析：</strong>${seg.why}</div>
  `;
}

function renderChecklist() {
  const ex = getExam(currentExamId);
  const marks = marksByExam[ex.id] || {};
  const segs = getAllSegments(ex);
  const grouped = { core: [], bonus: [], goal: [], theme: [] };

  segs.forEach(s => {
    const m = marks[s.id];
    if (m && grouped[m]) grouped[m].push(s);
  });

  const totalMarked = Object.keys(marks).length;
  const totalTargets = segs.filter(s => s.ans).length;
  document.getElementById("progressText").textContent =
    currentMode === "quiz"
      ? `已塗色：${totalMarked} 段（本題藏有 ${totalTargets} 個重點）`
      : `已塗色：${totalMarked} / ${totalTargets} 個重點`;

  const container = document.getElementById("checklistContainer");
  container.innerHTML = ["core", "bonus", "goal", "theme"].map(key => {
    const meta = PEN_META[key];
    const items = grouped[key];
    const listHtml = items.length
      ? `<ul class="cg-list">${items.map(it => `
          <li class="cg-item" data-jump="${it.id}">
            <span>☐</span>
            <span>${it.text}</span>
          </li>`).join("")}</ul>`
      : `<div class="cg-empty">尚未標記此類</div>`;

    return `
      <div class="checklist-group">
        <div class="cg-header ${key}">
          <span>${meta.emoji} ${meta.name}</span>
          <span>${items.length} 項</span>
        </div>
        ${listHtml}
      </div>
    `;
  }).join("");

  container.querySelectorAll(".cg-item").forEach(li => {
    li.addEventListener("click", () => {
      const seg = segs.find(s => s.id === li.dataset.jump);
      if (currentMode === "demo" || gradedByExam[ex.id] || revealedByExam[ex.id]) showExplain(seg);
      const target = document.querySelector(`.seg[data-id="${li.dataset.jump}"]`);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  });
}

function updateHeaderUI() {
  const ex = getExam(currentExamId);
  const isQuiz = currentMode === "quiz";
  const isGraded = !!gradedByExam[ex.id];
  const isRevealed = !!revealedByExam[ex.id];

  document.getElementById("btnGrade").style.display = isQuiz ? "inline-block" : "none";
  document.getElementById("btnReveal").style.display = (!isQuiz || isGraded) ? "inline-block" : "none";
  document.getElementById("modeHint").innerHTML = isQuiz
    ? `🎮 <strong>學生闖關模式</strong>：像真實比賽一樣沒有加粗提示！細讀每句話，塗出四類重點後按「✅ 交卷批改」。`
    : `🎓 <strong>老師示範模式</strong>：按鍵盤 <code>1~4</code> 切四色筆，直接點擊下方題目段落塗色給學生看！`;

  const scoreBox = document.getElementById("scoreBox");
  if (isQuiz && isGraded) scoreBox.classList.add("show");
  else scoreBox.classList.remove("show");

  const trapBox = document.getElementById("trapBox");
  if ((isQuiz && isGraded) || (!isQuiz && isRevealed)) {
    document.getElementById("trapText").textContent = ex.trapSummary;
    trapBox.classList.add("show");
  } else {
    trapBox.classList.remove("show");
  }
}

function gradeCurrent() {
  const ex = getExam(currentExamId);
  const segs = getAllSegments(ex);
  const marks = marksByExam[ex.id] || {};
  let targets = 0, exact = 0, wrongColor = 0, missed = 0, extra = 0;

  segs.forEach(s => {
    const m = marks[s.id];
    if (s.ans) {
      targets++;
      if (m === s.ans) exact++;
      else if (m) wrongColor++;
      else missed++;
    } else if (m) {
      extra++;
    }
  });

  const raw = ((exact + wrongColor * 0.5) / Math.max(targets, 1)) * 100 - extra * 4;
  const score = Math.max(0, Math.min(100, Math.round(raw)));

  gradedByExam[ex.id] = true;
  if (bestScoreByExam[ex.id] === undefined || score > bestScoreByExam[ex.id]) {
    bestScoreByExam[ex.id] = score;
    saveProgress();
  }

  document.getElementById("scoreNum").textContent = `${score} 分`;
  document.getElementById("scoreBadge").textContent =
    score >= 90 ? "🏆 讀題神探！" :
    score >= 75 ? "👍 很不錯，快補齊漏網之魚！" :
    score >= 50 ? "💪 抓到一半了，小心暗藏陷阱！" : "🧐 再細讀一次段落喔！";

  document.getElementById("scoreStats").innerHTML = `
    <span>✅ 命中 ${exact}/${targets}</span>
    <span>🟡 換色 ${wrongColor}</span>
    <span>🔴 漏抓 ${missed}</span>
    ${extra ? `<span>⚪ 多畫 ${extra}</span>` : ""}
  `;

  document.getElementById("explainBox").innerHTML =
    `批改完成！點擊題目中標示 <strong>「漏抓」</strong> 或 <strong>「換色」</strong> 的句子就能看解析，上方也解鎖了「🕵️ 本題暗藏陷阱」！`;

  renderPicker();
  renderExam();
}

// Mode Switch (Category tabs are bound dynamically in renderCatTabs)
document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentMode = btn.dataset.mode;
    document.querySelectorAll(".mode-btn").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    if (currentMode === "quiz") { seconds = 0; timerRunning = true; }
    renderExam();
  });
});

// Pens
function selectPen(pen) {
  currentPen = pen;
  document.querySelectorAll(".pen-btn").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.pen === pen));
  });
}

document.querySelectorAll(".pen-btn").forEach(btn => {
  btn.addEventListener("click", () => selectPen(btn.dataset.pen));
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const map = { "1": "core", "2": "bonus", "3": "goal", "4": "theme", "e": "eraser", "E": "eraser" };
  if (map[e.key]) selectPen(map[e.key]);
});

// Action Buttons
document.getElementById("btnGrade").addEventListener("click", gradeCurrent);

document.getElementById("btnReveal").addEventListener("click", () => {
  const ex = getExam(currentExamId);
  const segs = getAllSegments(ex);
  const marks = {};
  segs.forEach(s => { if (s.ans) marks[s.id] = s.ans; });
  marksByExam[ex.id] = marks;
  gradedByExam[ex.id] = false;
  revealedByExam[ex.id] = true;
  saveProgress();
  document.getElementById("explainBox").innerHTML =
    "已套用標準四色畫法！點擊任何一段有顏色的文字即可看解析，右側也已顯示「🕵️ 本題暗藏陷阱」。";
  renderExam();
});

document.getElementById("btnClear").addEventListener("click", () => {
  const ex = getExam(currentExamId);
  marksByExam[ex.id] = {};
  gradedByExam[ex.id] = false;
  revealedByExam[ex.id] = false;
  saveProgress();
  document.getElementById("explainBox").innerHTML = "已清除本題所有標記，可以重新開始塗色！";
  renderExam();
});

document.getElementById("btnCopy").addEventListener("click", () => {
  const ex = getExam(currentExamId);
  const marks = marksByExam[ex.id] || {};
  const segs = getAllSegments(ex);
  let out = `【${ex.title}｜四色讀題筆記】\n\n`;
  ["core", "bonus", "goal", "theme"].forEach(k => {
    const items = segs.filter(s => marks[s.id] === k);
    if (items.length) {
      out += `${PEN_META[k].emoji} ${PEN_META[k].name}\n`;
      items.forEach(it => { out += `- [ ] ${it.text}\n`; });
      out += "\n";
    }
  });
  navigator.clipboard.writeText(out).then(() => {
    const btn = document.getElementById("btnCopy");
    const old = btn.textContent;
    btn.textContent = "✅ 已複製";
    setTimeout(() => { btn.textContent = old; }, 1500);
  });
});

document.getElementById("btnPrint").addEventListener("click", () => window.print());

renderCatTabs();
renderPicker();
renderExam();
</script>
</body>
</html>
